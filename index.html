<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="chujiu0703-tech 的个人主页与项目展示站点">
  <title>chujiu0703-tech · 个人主页</title>
  <style>
    :root { color-scheme: dark; --bg:#08111f; --card:#101d32cc; --text:#eef6ff; --muted:#a9bbd2; --accent:#63e6be; --accent2:#74c0fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:radial-gradient(circle at 15% 20%,#123a52 0,transparent 35%),radial-gradient(circle at 85% 80%,#28315e 0,transparent 38%),var(--bg); display:grid; place-items:center; padding:24px; }
    main { width:min(920px,100%); border:1px solid #ffffff1f; border-radius:28px; padding:clamp(30px,7vw,72px); background:var(--card); box-shadow:0 30px 80px #0008; backdrop-filter:blur(18px); }
    .eyebrow { color:var(--accent); font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.78rem; }
    h1 { margin:.35em 0 .25em; font-size:clamp(2.8rem,9vw,6.5rem); line-height:.92; letter-spacing:-.06em; }
    h1 span { color:var(--accent2); }
    p { max-width:650px; color:var(--muted); font-size:clamp(1rem,2.5vw,1.25rem); line-height:1.75; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; }
    a { display:inline-flex; align-items:center; gap:8px; padding:13px 18px; border-radius:999px; color:var(--text); text-decoration:none; font-weight:700; border:1px solid #ffffff2a; transition:.2s ease; }
    a:first-child { color:#06251c; background:var(--accent); border-color:transparent; }
    a:hover { transform:translateY(-2px); box-shadow:0 10px 28px #0005; }
    footer { margin-top:46px; color:#71859e; font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Hello, GitHub Pages</div>
    <h1>你好，我是<br><span>chujiu0703-tech</span></h1>
    <p>欢迎来到我的个人主页。这里将用于展示开源项目、学习记录与新的想法。</p>
    <nav>
      <a href="https://github.com/chujiu0703-tech">查看 GitHub</a>
      <a href="https://github.com/chujiu0703-tech/li-xinnuo">我的项目</a>
    </nav>
    <footer>Built with GitHub Pages · 2026</footer>
  </main>
</body>
</html>
