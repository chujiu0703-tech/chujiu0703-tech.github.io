<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="智能体中枢固定入口：在任意电脑和浏览器中打开系统登录页。">
  <meta name="theme-color" content="#09101f">
  <title>智能体中枢 · 系统入口</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: rgba(14, 23, 42, .78);
      --panel-strong: #111b30;
      --line: rgba(148, 163, 184, .18);
      --text: #f8fafc;
      --muted: #9aa9bf;
      --primary: #8b5cf6;
      --primary-2: #4f46e5;
      --cyan: #22d3ee;
      --green: #34d399;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(79, 70, 229, .27), transparent 34rem),
        radial-gradient(circle at 82% 82%, rgba(34, 211, 238, .16), transparent 30rem),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .shell {
      position: relative;
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: auto;
      display: grid;
      align-content: center;
      padding: 48px 0;
    }
    .topbar {
      position: absolute;
      top: 28px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.02em; }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 32px rgba(79, 70, 229, .35);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b8c4d6;
      font-size: .82rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(52, 211, 153, .1), 0 0 20px rgba(52, 211, 153, .65);
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(290px, .75fr);
      gap: 26px;
      align-items: stretch;
    }
    .hero, .aside {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .34);
    }
    .hero {
      min-height: 510px;
      padding: clamp(32px, 6vw, 72px);
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      color: #c4b5fd;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(3.2rem, 8vw, 7.4rem);
      line-height: .88;
      letter-spacing: -.075em;
    }
    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 0%, #818cf8 44%, #67e8f9 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }
    .lead {
      max-width: 630px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.7vw, 1.18rem);
      line-height: 1.8;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
    .button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.035);
      font: inherit;
      font-size: .92rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); border-color: rgba(129,140,248,.7); background: rgba(255,255,255,.07); }
    .button.primary {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 14px 35px rgba(79, 70, 229, .34);
    }
    .aside {
      border-radius: 28px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .aside h2 { margin: 0; font-size: 1rem; }
    .route {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(3,7,18,.42);
      padding: 18px;
    }
    .route-row { display: flex; align-items: center; gap: 12px; }
    .route-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 13px;
      color: #c4b5fd;
      background: rgba(139,92,246,.15);
    }
    .route strong, .route span { display: block; }
    .route span { margin-top: 4px; color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
    .countdown {
      margin-top: 26px;
      padding: 18px;
      border-radius: 18px;
      color: #dbeafe;
      background: linear-gradient(135deg, rgba(79,70,229,.17), rgba(34,211,238,.08));
    }
    .countdown strong { font-size: 2.4rem; line-height: 1; }
    .countdown p { margin: 8px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.6; }
    .aside .button { width: 100%; margin-top: 12px; }
    .tip {
      margin-top: 22px;
      color: #72839a;
      font-size: .75rem;
      line-height: 1.7;
    }
    footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #607089;
      font-size: .72rem;
    }
    footer a { color: #7f8ea6; text-decoration: none; }
    @media (max-width: 800px) {
      .shell { padding: 104px 0 80px; }
      main { grid-template-columns: 1fr; }
      .hero { min-height: auto; }
      h1 { font-size: clamp(3.1rem, 17vw, 5.2rem); }
      footer { position: static; margin-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 20 7.5v9L12 21l-8-4.5v-9L12 3Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="m8 12 2.4 2.4L16.5 8.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        智能体中枢
      </div>
      <div class="status"><span class="dot"></span>云端入口已启用</div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Agent Nexus Cloud</div>
        <h1>一个入口，<br><span>连接全部智能体。</span></h1>
        <p class="lead">通过这个固定页面进入智能体系统。你可以在任意电脑或浏览器中打开入口，再登录主系统或已分配的子系统账户。</p>
        <div class="actions">
          <a class="button primary" id="enter" href="https://agent-nexus-cloud.stillrat6.chatgpt.site/">
            立即进入系统
            <span aria-hidden="true">→</span>
          </a>
          <button class="button" id="copy" type="button">复制系统地址</button>
        </div>
      </section>

      <aside class="aside">
        <div>
          <h2>访问路线</h2>
          <div class="route">
            <div class="route-row">
              <span class="route-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M8 11V8a4 4 0 1 1 8 0v3M6 11h12v9H6v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
              </span>
              <div>
                <strong>安全登录</strong>
                <span>agent-nexus-cloud.stillrat6.chatgpt.site</span>
              </div>
            </div>
          </div>
          <div class="countdown" aria-live="polite">
            <strong id="seconds">5</strong>
            <p id="countdown-text">秒后自动进入智能体系统</p>
          </div>
          <button class="button" id="pause" type="button">暂停自动跳转</button>
          <p class="tip">若目标网站被当前网络拦截，请返回此入口页并切换网络或手机热点后重试。</p>
        </div>
      </aside>
    </main>

    <footer>
      <span>固定入口 · GitHub Pages</span>
      <a href="https://github.com/chujiu0703-tech" rel="noreferrer">chujiu0703-tech</a>
    </footer>
  </div>

  <noscript>
    <style>.countdown,#pause{display:none}</style>
  </noscript>
  <script>
    (() => {
      const target = "https://agent-nexus-cloud.stillrat6.chatgpt.site/";
      const secondsNode = document.getElementById("seconds");
      const textNode = document.getElementById("countdown-text");
      const pauseButton = document.getElementById("pause");
      const copyButton = document.getElementById("copy");
      let seconds = 5;
      let timer = window.setInterval(() => {
        seconds -= 1;
        secondsNode.textContent = String(Math.max(seconds, 0));
        if (seconds <= 0) {
          window.clearInterval(timer);
          window.location.assign(target);
        }
      }, 1000);

      pauseButton.addEventListener("click", () => {
        window.clearInterval(timer);
        secondsNode.textContent = "—";
        textNode.textContent = "自动跳转已暂停，可点击“立即进入系统”";
        pauseButton.disabled = true;
        pauseButton.textContent = "已暂停自动跳转";
      });

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(target);
        } catch {
          const input = document.createElement("textarea");
          input.value = target;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        copyButton.textContent = "已复制";
        window.setTimeout(() => { copyButton.textContent = "复制系统地址"; }, 1600);
      });
    })();
  </script>
</body>
</html>
